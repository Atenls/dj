<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: https://icon.jx3box.com https://cdn.jx3box.com; connect-src 'self' blob:; base-uri 'none'; form-action 'none'">
  <title>毒理学手札</title>
  <link rel="icon" href="aleph-null-transparent.svg">
  <link rel="stylesheet" href="unlock.css">
  <script type="module" src="unlock.js"></script>
</head>
<body>
  <main id="gate" class="gate" aria-label="毒理学手札">
    <img class="site-mark" src="aleph-null-transparent.svg" width="128" height="128" alt="">
    <div class="gate-controls">
      <form id="unlock-form">
        <div class="credential-field">
          <input id="site-password" type="password" aria-label="访问凭证" aria-describedby="status" placeholder="输入访问凭证"
            autocomplete="current-password" enterkeyhint="go" required>
          <button type="submit" disabled>进入</button>
        </div>
        <p id="status" role="status"></p>
      </form>
      <noscript>请启用 JavaScript 后解锁。</noscript>
    </div>
  </main>
</body>
</html>
